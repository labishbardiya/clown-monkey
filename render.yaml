services:
  - type: web
    name: clown-monkey-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: poetry run uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit

  - type: web
    name: clown-monkey-web
    runtime: static
    rootDir: frontend
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      VITE_HTTP_BACKEND_URL="https://${BACKEND_HOST}"
      VITE_WS_BACKEND_URL="wss://${BACKEND_HOST}"
      pnpm build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: clown-monkey-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
